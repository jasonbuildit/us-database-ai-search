services:
  postgres:
    build: ./db
    container_name: usaspending-pg
    environment:
      POSTGRES_DB: usaspending
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command: >
      postgres
      -c shared_buffers=4GB
      -c work_mem=256MB
      -c maintenance_work_mem=1GB
      -c effective_cache_size=12GB
      -c max_wal_size=4GB
      -c jit=off
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ${DUMP_DIR:-./dump}:/dump:ro
    ports:
      - "5432:5432"
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usaspending"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: usaspending-ollama
    environment:
      OLLAMA_NUM_PARALLEL: "8"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ./ollama:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    container_name: usaspending-metabase
    environment:
      MB_DB_TYPE: h2
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  ai:
    build: ./ai
    container_name: usaspending-ai
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: usaspending
      OLLAMA_HOST: http://ollama:11434
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      SQL_STATEMENT_TIMEOUT_MS: "60000"
      SQL_ROW_LIMIT: "1000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
