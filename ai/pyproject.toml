[project]
name = "usaspending-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[tool.setuptools]
py-modules = ["server", "schema_introspect", "text_to_sql", "embed", "agent", "db"]
